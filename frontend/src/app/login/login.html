<main class="login-page">
  <section class="card login-card shadow-sm" aria-labelledby="login-title">
    <div class="card-body p-4 p-md-5">
      <h1 id="login-title" class="h3 text-center mb-2">Welcome back</h1>

      @if (feedback(); as message) {
        <div
          class="alert"
          [class.alert-success]="message.type === 'success'"
          [class.alert-danger]="message.type === 'error'"
          role="alert"
        >
          {{ message.message }}
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            required
            autocomplete="username"
            [attr.aria-invalid]="
              loginForm.controls.username.invalid && loginForm.controls.username.touched
            "
            (input)="clearFeedback()"
          />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            required
            autocomplete="current-password"
            [attr.aria-invalid]="
              loginForm.controls.password.invalid && loginForm.controls.password.touched
            "
            (input)="clearFeedback()"
          />
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </section>
</main>
