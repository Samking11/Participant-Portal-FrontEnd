# ===================================================================
# Production Profile Configuration (prod)
# ===================================================================

# PostgreSQL Database Configuration (with environment variable fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.21.17:5432/acs_participant_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak Production Realm Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://192.168.20.49:9091/realms/acs}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://192.168.20.49:9091/realms/acs/protocol/openid-connect/certs}

# Production Logging Level
logging.level.org.multimedia=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
